<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- ExileAppraiser / 流亡鑑價 app icon:深底圓角方 + 金色天平(鑑價),配色取自 PobTools slate 主題 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2029"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <!-- userSpaceOnUse:純水平/垂直的 line 外框寬或高為 0,objectBoundingBox 漸層會讓它整條不畫(SVG 規範) -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="216">
      <stop offset="0" stop-color="#f0c96a"/>
      <stop offset="1" stop-color="#c8963a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#2a3442" stroke-width="4"/>
  <g stroke="url(#gold)" stroke-width="14" stroke-linecap="round" fill="none">
    <!-- 支柱 -->
    <line x1="128" y1="62" x2="128" y2="196"/>
    <!-- 橫樑 -->
    <line x1="52" y1="84" x2="204" y2="84"/>
    <!-- 吊索 -->
    <line x1="64" y1="84" x2="44" y2="140"/>
    <line x1="64" y1="84" x2="84" y2="140"/>
    <line x1="192" y1="84" x2="172" y2="140"/>
    <line x1="192" y1="84" x2="212" y2="140"/>
    <!-- 底座 -->
    <line x1="86" y1="204" x2="170" y2="204"/>
  </g>
  <!-- 秤盤 -->
  <path d="M30 142 H98 A34 20 0 0 1 30 142 Z" fill="url(#gold)"/>
  <path d="M158 142 H226 A34 20 0 0 1 158 142 Z" fill="url(#gold)"/>
  <!-- 樑頂裝飾:菱形(呼應 PobTools 品牌菱形) -->
  <rect x="116" y="42" width="24" height="24" rx="3" transform="rotate(45 128 54)" fill="#f0c96a"/>
</svg>
